[package]
name = "dump-analyzer"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
publish = false

# Approved dependency set. Tasks must not add dependencies; the integrator
# owns this manifest (Plans/rust-implementation-tasks.md).
[dependencies]
async-trait = "0.1"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs", "process", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
wiremock = "0.6"
# MBT (tests/mbt.rs): replay TLC-generated spec traces against the real state
# layer through the Mirrors protocol (tools/mbt/gen_traces.py generates the
# corpus; MIRROR_BIN selects the mirror executable at test time).
mirrorrust = { path = "../MirrorRust" }
num-bigint = "0.4"
